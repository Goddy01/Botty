[package]
name = "copybot"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[lib]
name = "copybot"
path = "src/lib.rs"

[[bin]]
name = "copybot"
path = "src/main.rs"

[features]
default = []
laserstream = ["dep:yellowstone-grpc-client", "dep:yellowstone-grpc-proto"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "net", "io-util"] }
toml = "0.8"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
yellowstone-grpc-client = { version = "6.1", optional = true }
yellowstone-grpc-proto = { version = "6.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
